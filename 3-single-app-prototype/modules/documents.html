<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Documents</h2></div>
  <div class="actions"><button class="button" type="button">Upload document</button></div>
</div>

<section>
  <h3 class="section-heading">All documents</h3>
  <table class="data-table">
    <caption>All documents</caption>
    <thead>
      <tr>
        <th scope="col">Document</th>
        <th scope="col">Type</th>
        <th scope="col">Date</th>
        <th scope="col">Added by</th>
        <th scope="col" aria-label="Actions"></th>
      </tr>
    </thead>
    <tbody data-list="documents">
      <template>
        <tr>
          <th scope="row">
            <a href="#" style="color:var(--blue);text-decoration:underline" data-field="name"></a>
          </th>
          <td data-field="type"></td>
          <td data-field="date"></td>
          <td data-field="addedBy"></td>
          <td><a href="#" style="color:var(--blue);text-decoration:underline">View</a></td>
        </tr>
      </template>
      <tr data-empty hidden>
        <td colspan="5" style="color:var(--text-muted);padding:20px 0">No documents recorded.</td>
      </tr>
    </tbody>
  </table>
</section>
