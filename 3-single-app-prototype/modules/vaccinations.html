<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Vaccinations</h2></div>
  <div class="actions"><button class="button" type="button">Record vaccination</button></div>
</div>

<div class="inset-text" data-if="isPregnant">
  Patient is currently pregnant. Review antenatal vaccination schedule.
</div>

<section>
  <h3 class="section-heading">Vaccination status</h3>
  <dl class="summary-list" data-list="schedule">
    <template>
      <div class="sl-row">
        <dt data-field="name"></dt>
        <dd><span data-field="doseInfo"></span><br><span data-field="statusTag"></span></dd>
        <dd class="sl-actions"><a href="#" data-field="actionLabel"></a></dd>
      </div>
    </template>
    <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No vaccination schedule recorded.</div>
  </dl>
</section>

<section>
  <h3 class="section-heading">Vaccination history</h3>
  <table class="data-table">
    <caption>Vaccination history</caption>
    <thead>
      <tr>
        <th scope="col">Vaccine</th>
        <th scope="col">Dose</th>
        <th scope="col">Date given</th>
        <th scope="col">Batch</th>
        <th scope="col">Recorded by</th>
      </tr>
    </thead>
    <tbody data-list="history">
      <template>
        <tr>
          <th scope="row" data-field="vaccine"></th>
          <td data-field="dose"></td>
          <td data-field="date"></td>
          <td class="mono" style="font-size:14px" data-field="batch"></td>
          <td data-field="by"></td>
        </tr>
      </template>
      <tr data-empty hidden>
        <td colspan="5" style="color:var(--text-muted);padding:20px 0">No vaccinations recorded.</td>
      </tr>
    </tbody>
  </table>
</section>
