<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Prescribing</h2></div>
  <div class="actions"><button class="button" type="button">Add medication</button></div>
</div>

<div class="columns">
  <div class="col-main">

    <section>
      <h3 class="section-heading">Current medications</h3>
      <dl class="summary-list" data-list="currentMeds">
        <template>
          <div class="sl-row">
            <dt data-field="name"></dt>
            <dd>
              <span data-field="dose"></span><br>
              <span data-field="startedBy"></span>
              <span data-if="hasIndication"><br><span data-field="indication"></span></span>
              <br><span data-field="statusTag"></span>
            </dd>
            <dd class="sl-actions">
              <a href="#">Change</a><br>
              <a href="#" style="color:var(--red)">Stop</a>
            </dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No current medications.</div>
      </dl>
    </section>

    <section>
      <h3 class="section-heading">Stopped medications</h3>
      <dl class="summary-list" data-list="stoppedMeds">
        <template>
          <div class="sl-row">
            <dt data-field="name"></dt>
            <dd>
              <span data-field="stoppedDetail"></span><br>
              Reason: <span data-field="reason"></span><br>
              <span data-field="statusTag"></span>
            </dd>
            <dd class="sl-actions"><a href="#">Restart</a></dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No stopped medications.</div>
      </dl>
    </section>

  </div><!-- /col-main -->

  <aside class="col-side">

    <section data-if="hasAllergies">
      <h3 class="section-heading">Allergy alert</h3>
      <div class="inset-text" style="border-left-color:var(--red)" data-field="allergyAlertHtml"></div>
    </section>

    <section data-if="hasCautions" style="margin-top:30px">
      <h3 class="section-heading">Prescribing cautions</h3>
      <ul class="related-nav" data-list="cautions">
        <template>
          <li>
            <strong data-field="label"></strong>
            <span class="meta" data-field="detail"></span>
          </li>
        </template>
      </ul>
    </section>

  </aside>
</div>
