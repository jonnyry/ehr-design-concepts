<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Encounters</h2></div>
  <div class="actions"><button class="button" type="button">Start new encounter</button></div>
</div>

<section>
  <h3 class="section-heading">All encounters</h3>
  <table class="data-table">
    <caption>All encounters</caption>
    <thead>
      <tr>
        <th scope="col">Date</th>
        <th scope="col">Type</th>
        <th scope="col">Clinician</th>
        <th scope="col">Notes</th>
        <th scope="col">Status</th>
        <th scope="col" aria-label="Actions"></th>
      </tr>
    </thead>
    <tbody data-list="encounters">
      <template>
        <tr>
          <td data-field="date"></td>
          <td data-field="type"></td>
          <td data-field="clinician"></td>
          <td data-field="notes"></td>
          <td data-field="statusTag"></td>
          <td><a href="#" style="color:var(--blue);text-decoration:underline">View</a></td>
        </tr>
      </template>
      <tr data-empty hidden>
        <td colspan="6" style="color:var(--text-muted);padding:20px 0">No encounters recorded.</td>
      </tr>
    </tbody>
  </table>
</section>
