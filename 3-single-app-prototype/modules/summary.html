<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Summary</h2></div>
  <div class="actions">
    <button class="button secondary" type="button">Print summary</button>
    <button class="button" type="button">Start new encounter</button>
  </div>
</div>

<div class="columns">
  <div class="col-main">

    <section>
      <h3 class="section-heading">Active problems</h3>
      <dl class="summary-list" data-list="problems">
        <template>
          <div class="sl-row">
            <dt data-field="name"></dt>
            <dd><span data-field="detail"></span><br><span data-field="statusTag"></span></dd>
            <dd class="sl-actions"><a href="#">Change</a></dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No problems recorded.</div>
      </dl>
    </section>

    <section>
      <h3 class="section-heading">Current medication</h3>
      <dl class="summary-list" data-list="medications">
        <template>
          <div class="sl-row">
            <dt data-field="name"></dt>
            <dd data-field="doseDate"></dd>
            <dd class="sl-actions"><a href="#">Change</a></dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No medications recorded.</div>
      </dl>
    </section>

    <section data-if="hasVitals">
      <h3 class="section-heading">Latest vitals</h3>
      <p style="margin:0 0 10px;color:var(--text-muted)">Recorded
        <span data-field="vitalsDate"></span> by
        <span data-field="vitalsBy"></span>.
      </p>
      <table class="data-table">
        <caption>Latest vitals</caption>
        <thead>
          <tr>
            <th scope="col">Measurement</th>
            <th scope="col" class="numeric">Value</th>
            <th scope="col" class="numeric">Reference</th>
          </tr>
        </thead>
        <tbody data-list="vitalRows">
          <template>
            <tr>
              <th scope="row" data-field="name"></th>
              <td class="numeric" data-field="valueHtml"></td>
              <td class="numeric" data-field="reference"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <div class="inset-text" data-if="vitalsNote" data-field="vitalsNote"></div>
    </section>

  </div><!-- /col-main -->

  <aside class="col-side" aria-label="Related">

    <section>
      <h3 class="section-heading">Recent encounters</h3>
      <ul class="related-nav" data-list="recentEncounters">
        <template>
          <li>
            <a href="#/encounters" data-field="type"></a>
            <span class="meta" data-field="dateClinician"></span>
          </li>
        </template>
        <li data-empty hidden style="color:var(--text-muted)">No encounters recorded.</li>
      </ul>
    </section>

    <section style="margin-top:30px">
      <h3 class="section-heading">Allergies and intolerances</h3>
      <ul class="related-nav" data-list="allergies">
        <template>
          <li>
            <strong data-field="substance"></strong>
            <span class="meta" data-field="severityConfirmed"></span>
          </li>
        </template>
        <li data-empty hidden style="color:var(--text-muted)">No allergies recorded.</li>
      </ul>
    </section>

  </aside>
</div>
