<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Comms</h2></div>
  <div class="actions"><button class="button" type="button">New message</button></div>
</div>

<div class="columns">
  <div class="col-main">

    <section>
      <h3 class="section-heading">Referrals</h3>
      <dl class="summary-list" data-list="referrals">
        <template>
          <div class="sl-row">
            <dt data-field="name"></dt>
            <dd><span data-field="toAndDate"></span><br><span data-field="statusTag"></span></dd>
            <dd class="sl-actions"><a href="#">View</a></dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No referrals recorded.</div>
      </dl>
    </section>

    <section>
      <h3 class="section-heading">Messages</h3>
      <dl class="summary-list" data-list="messages">
        <template>
          <div class="sl-row">
            <dt style="font-weight:400">
              <span data-field="fromTo"></span><br>
              <span style="font-size:15px;color:var(--text-muted)" data-field="dateCh"></span>
            </dt>
            <dd data-field="text"></dd>
            <dd class="sl-actions"><span data-field="statusTag"></span></dd>
          </div>
        </template>
        <div data-empty hidden style="padding:15px 0;color:var(--text-muted)">No messages recorded.</div>
      </dl>
    </section>

  </div><!-- /col-main -->

  <aside class="col-side">

    <section>
      <h3 class="section-heading">Patient contacts</h3>
      <ul class="related-nav">
        <li data-if="hasPatientPhone">
          <strong>Mobile</strong>
          <span class="meta" data-field="patientPhone"></span>
        </li>
        <li data-if="hasAltPhone">
          <strong>Alt.</strong>
          <span class="meta" data-field="patientAltPhone"></span>
        </li>
        <li data-if="hasNoContacts" style="color:var(--text-muted)">No contacts recorded.</li>
      </ul>
    </section>

    <section data-if="hasContacts" style="margin-top:30px">
      <h3 class="section-heading">External contacts</h3>
      <ul class="related-nav" data-list="contacts">
        <template>
          <li>
            <strong data-field="label"></strong>
            <span class="meta" data-field="phone"></span>
          </li>
        </template>
      </ul>
    </section>

  </aside>
</div>
