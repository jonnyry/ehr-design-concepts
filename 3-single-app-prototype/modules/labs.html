<div class="page-heading">
  <div><span class="caption">Patient record</span><h2>Labs</h2></div>
  <div class="actions">
    <button class="button secondary" type="button">Print results</button>
    <button class="button" type="button">Request test</button>
  </div>
</div>

<section data-if="hasPending">
  <h3 class="section-heading">Results awaiting review</h3>
  <div class="inset-text" style="border-left-color:var(--red)">
    <strong data-field="pendingIntro"></strong>
  </div>
  <dl class="summary-list" data-list="pendingResults">
    <template>
      <div class="sl-row">
        <dt data-field="name"></dt>
        <dd>
          <span data-field="result"></span><br>
          <span data-field="dates"></span><br>
          <span data-field="statusTag"></span>
        </dd>
        <dd class="sl-actions"><a href="#">Review</a></dd>
      </div>
    </template>
  </dl>
</section>

<section>
  <h3 class="section-heading">Previous results</h3>
  <table class="data-table">
    <caption>Previous results</caption>
    <thead>
      <tr>
        <th scope="col">Test</th>
        <th scope="col">Result</th>
        <th scope="col">Reference</th>
        <th scope="col">Date</th>
        <th scope="col">Ordered by</th>
        <th scope="col" aria-label="Actions"></th>
      </tr>
    </thead>
    <tbody data-list="historyResults">
      <template>
        <tr>
          <th scope="row" data-field="name"></th>
          <td data-field="result"></td>
          <td data-field="reference"></td>
          <td data-field="date"></td>
          <td data-field="orderedBy"></td>
          <td><a href="#" style="color:var(--blue);text-decoration:underline">View</a></td>
        </tr>
      </template>
      <tr data-empty hidden>
        <td colspan="6" style="color:var(--text-muted);padding:20px 0">No previous results.</td>
      </tr>
    </tbody>
  </table>
</section>
